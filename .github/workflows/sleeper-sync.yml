name: Sleeper League Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_full.py'
      - 'scripts/enrich_external.py'
      - '.github/workflows/sleeper-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Sleeper league and live player data
        run: python scripts/sync_full.py
      - name: Enrich schedule and current news
        run: python scripts/enrich_external.py
      - name: Commit refreshed data
        run: |
          git config user.name "jagger-gm-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Jagger GM live data"
            git pull --rebase
            git push
          fi
