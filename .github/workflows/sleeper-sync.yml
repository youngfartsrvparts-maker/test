name: Jagger GM Live Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_v3.py'
      - 'scripts/nflverse_history.py'
      - 'scripts/elite_enrich.py'
      - 'scripts/context_enrich.py'
      - 'scripts/role_news_enrich.py'
      - 'scripts/my_team_news_enrich.py'
      - 'scripts/scenario_enrich.py'
      - 'scripts/data_audit.py'
      - '.github/workflows/sleeper-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull live league truth from Sleeper
        run: python scripts/sync_v3.py
      - name: Add completed-season nflverse production evidence
        run: python scripts/nflverse_history.py
      - name: Build advanced historical usage profiles
        run: python scripts/elite_enrich.py
      - name: Add weekly distributions current usage and schedule context
        run: python scripts/context_enrich.py
      - name: Add verified league-wide high-impact role changes
        run: python scripts/role_news_enrich.py
      - name: Analyze pre-lock news for every player on Jagger roster
        run: python scripts/my_team_news_enrich.py
      - name: Build future Sleeper matchup and projection scenarios
        run: python scripts/scenario_enrich.py
      - name: Audit recommendation data completeness
        run: python scripts/data_audit.py
      - name: Commit live snapshot
        run: |
          git config user.name "jagger-gm-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/ v3/snapshot.js
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "Refresh Jagger GM complete manager intelligence"; git pull --rebase; git push; fi
