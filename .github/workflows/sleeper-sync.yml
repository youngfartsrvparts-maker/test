name: Sleeper League Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_sleeper.py'
      - '.github/workflows/sleeper-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Sleeper league data
        run: python scripts/sync_sleeper.py
      - name: Commit refreshed data
        run: |
          git config user.name "sleeper-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Sleeper league data"
            git push
          fi
