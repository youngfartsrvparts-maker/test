name: Sleeper ChatGPT Bridge
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_v3.py'
      - 'TRIGGER_SYNC.txt'
      - '.github/workflows/sleeper-bridge.yml'
permissions:
  contents: write
concurrency:
  group: jagger-sleeper-data
  cancel-in-progress: false
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull current Sleeper league data
        run: python scripts/sync_v3.py
      - name: Publish compact live bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jagger-sleeper-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add data/chatgpt_bridge.json data/status.json data/league.json data/rosters.json data/users.json data/matchups.json data/transactions.json data/nfl_state.json data/players_cache_meta.json data/players_nfl.json data/trending_add_v3.json data/trending_drop_v3.json data/draft_picks.json data/health_v3.json data/dashboard.json v3/snapshot.js
          if git diff --cached --quiet; then
            echo "Bridge already current"
            exit 0
          fi
          git commit -m "Refresh live Sleeper ChatGPT bridge"
          git reset --hard HEAD
          git fetch origin main
          for attempt in 1 2 3; do
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort || true
            git fetch origin main
            sleep $((attempt * 2))
          done
          echo "Failed to publish bridge after retries" >&2
          exit 1
